# Proyecto Ansible de la Etapa N2 (~adminlab/siem-lab), separado de ~/ansible-lab para que
# 'lab.sh stage7-setup' no lo pise. Reutiliza el inventario, las group_vars y el Vault de la Etapa 7.
[defaults]
inventory            = /home/adminlab/ansible-lab/inventory/hosts.ini
remote_user          = adminlab
vault_password_file  = /home/adminlab/.vault_pass.txt
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
stdout_callback      = default
timeout              = 15

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False
