# Inventario de la Etapa 8 (VMware vSphere): los ESXi son VMs de KVM, pero NO son RHEL.
# Viven aquí y NO en hosts.conf a propósito: así 'lab.sh <stageN|test|push|up|down> all'
# nunca intenta hacer push de scripts, tests o stage2-7 contra un ESXi.
#
# ROLE: free = ISO gratuito 8.0U3e (licencia gratuita embebida, NO se puede unir a vCenter)
#       eval = instalador estándar de ESXi 8 (arranca en evaluación de 60 días; SÍ se une a vCenter)
# NICS: nº de NICs vmxnet3 en lab-net (vmnic0 = gestión + VMs + NFS; vmnic1 = vMotion)
# VMOTION_IP: IP del VMkernel vmk1 (pila TCP/IP 'vmotion'), "-" si el host no hace vMotion
#
# NAME     ROLE  IP           VCPUS  MEM_MB  BOOT_GB  DATA_GB  NICS  VMOTION_IP
esxi01     free  10.10.10.60  4      10240   40       80       1     -
esxi02     eval  10.10.10.61  4      18432   40       120      2     10.10.10.71
esxi03     eval  10.10.10.62  4      8192    40       0        2     10.10.10.72
#
# Corren DENTRO de los ESXi (no son VMs de libvirt; no aparecen en 'virsh list'):
#   vcsa01      10.10.10.63   vCenter Server Appliance "tiny" (2 vCPU, 14 GB) en esxi02
#   rhel9-vm01  10.10.10.64   VM RHEL 9 de prueba (en esxi01 en la fase A; en el clúster en la B)
# MEM_MB de esxi02 baja a 14336 tras reducir VCSA a 10-12 GB (ver checklists/etapa8.md, fase 6).
