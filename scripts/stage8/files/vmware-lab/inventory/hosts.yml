---
# Inventario de la Etapa 8. Las IPs son las reservadas en el README y en scripts/vmware.conf.
#
# esxi_* y vcenter NO se gestionan por SSH: son "objetivos de API". Los playbooks que
# hablan con vSphere corren en localhost (ansible01) y usan pyVmomi; estos grupos sirven
# para tener los nombres y las IPs en un solo sitio (groups['esxi_eval'], etc.).
all:
  children:
    esxi:
      children:
        esxi_free:
          hosts:
            esxi01: {ansible_host: 10.10.10.60}
        esxi_eval:
          hosts:
            esxi02: {ansible_host: 10.10.10.61, vmotion_ip: 10.10.10.71}
            esxi03: {ansible_host: 10.10.10.62, vmotion_ip: 10.10.10.72}
    vcenter:
      hosts:
        vcsa01: {ansible_host: 10.10.10.63}
    # VMs que corren DENTRO de los ESXi y SÍ se gestionan por SSH, como el resto del lab
    vmware_guests:
      hosts:
        rhel9-vm01: {ansible_host: 10.10.10.64}
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
