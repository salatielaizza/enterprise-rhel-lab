# Proyecto Ansible de la Etapa 8 (VMware). Vive en ~adminlab/vmware-lab, APARTE de
# ~adminlab/ansible-lab (Etapa 7), y se ejecuta con el ansible-core del entorno
# virtual ~/.venvs/vmware (community.vmware 6.x exige ansible-core >= 2.19).
#
# Reutiliza de la Etapa 7: la contraseña de Ansible Vault, la clave SSH de adminlab
# y los roles (roles_path incluye ~/ansible-lab/roles) para dar a rhel9-vm01 la
# misma configuración base que al resto del lab.
[defaults]
inventory            = ./inventory/hosts.yml
roles_path           = ./roles:~/ansible-lab/roles
collections_path     = ~/.ansible/collections
vault_password_file  = /home/adminlab/.vault_pass.txt
remote_user          = adminlab
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
stdout_callback      = default
timeout              = 15

[privilege_escalation]
# Los plays contra la API de vSphere corren en localhost sin privilegios; solo el
# play de la VM invitada (60-guest-baseline.yml) activa 'become' explícitamente.
become          = False
become_method   = sudo
become_user     = root
become_ask_pass = False
