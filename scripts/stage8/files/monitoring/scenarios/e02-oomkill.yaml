# Escenario E02 de la Etapa 8.8 — OOMKilled: la aplicación intenta ocupar 256 MB con un límite de 128 Mi
# Aplicar:  kubectl apply -f scenarios/e02-oomkill.yaml       Deshacer:  kubectl delete -f scenarios/e02-oomkill.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e02-memoria
  namespace: demo
  labels:
    app.kubernetes.io/name: e02-memoria
    lab/escenario: "E02"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e02-memoria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e02-memoria
        lab/escenario: "E02"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          command: ["./podinfo", "--port=9898", "--stress-memory=256"]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
