# Receptor de alertas del lab: un servidor HTTP que imprime cada POST que recibe.
# Hace de "móvil de guardia": kubectl -n monitoring logs -f deploy/alert-receiver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: receiver
          image: python:3.13-alpine
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
                      for a in body.get("alerts", []):
                          lb, an = a.get("labels", {}), a.get("annotations", {})
                          print(f'{a.get("status","?").upper():9} {lb.get("severity","-"):8} {lb.get("alertname")} '
                                f'ns={lb.get("namespace","-")} pod={lb.get("pod","-")} :: {an.get("summary") or an.get("description","")}')
                      self.send_response(200); self.end_headers()
                  def log_message(self, *args): pass
              HTTPServer(("", 8080), H).serve_forever()
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: alert-receiver
  ports:
    - {name: http, port: 8080, targetPort: http}
