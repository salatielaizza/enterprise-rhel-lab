# =============================================================================
# config/isos.conf — ISOs del laboratorio
#
# Formato:  <clave>  <sha256>
#
# El SHA-256 identifica la ISO de forma inequívoca: la API de Red Hat descarga
# POR CHECKSUM, y el mismo valor se usa después para verificar el fichero.
# No es un secreto: puede ir en Git.
#
# Dónde obtenerlos:
#   https://access.redhat.com/downloads/content/rhel  (elige versión → "DVD iso")
#   o con: ./scripts/download-isos.sh --list 9.6   (experimental, ver doc)
#
# Recomendación:
#   rhel7  → última minor: 7.9  (RHEL 7 está en ELS; si tu Developer
#            Subscription no la ofrece, déjala vacía y lo documentamos)
#   rhel8  → última 8.x disponible   rhel9 → última 9.x   rhel10 → última 10.x
#   Siempre "Binary DVD" (contiene BaseOS + AppStream → instalación offline)
#
# Una clave con valor vacío se ignora (no se descarga).
# =============================================================================
