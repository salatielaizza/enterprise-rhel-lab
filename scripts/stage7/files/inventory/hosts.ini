# Inventario estático del lab (IPs y nombres fijados desde la Etapa 1; ver
# architecture/hosts.md). ansible01 NO se incluye como nodo gestionado: es el
# propio nodo de control, y ejecuta ansible-playbook contra este inventario.
[app]
rhel7-app01  ansible_host=10.10.10.11
rhel8-app01  ansible_host=10.10.10.12
rhel9-app01  ansible_host=10.10.10.13
rhel10-app01 ansible_host=10.10.10.14

[dns]
dns01 ansible_host=10.10.10.20

# Grupo "padre" con todos los nodos gestionados por este lab (sin ansible01)
[lab:children]
app
dns

[lab:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519
