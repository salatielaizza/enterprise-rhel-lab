---
# Playbook principal de la Etapa 7. Ejecutarlo repetidamente contra los mismos
# hosts debe ser seguro (idempotencia): 'lab.sh stage7 site' se puede lanzar
# tantas veces como se quiera.
#
# Etiquetas de rol (las heredan todas sus tareas):
#   common    -> todo el rol common
#   usuarios  -> todo el rol lab_users
# Etiquetas de tarea dentro de common: paquetes, huso, marcador, vault
# Ver todas: ansible-playbook playbooks/site.yml --list-tags
- name: Etapa 7 — Configuración base gestionada por Ansible
  hosts: lab
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    - role: lab_users
      tags: [usuarios]
