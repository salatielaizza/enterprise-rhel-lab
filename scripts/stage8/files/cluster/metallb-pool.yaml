# MetalLB — Etapa 8.4. IPs del lab para los Service type: LoadBalancer.
# .110-.119 están reservadas en el README; grafana/prometheus/... tienen registro A en dns01.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.110-10.10.10.119
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
