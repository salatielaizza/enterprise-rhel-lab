---
# Rol "common": lo mínimo que queremos igual en TODOS los nodos gestionados.
# Cada tarea es idempotente por sí sola: en un segundo 'lab.sh stage7 site' sobre
# un nodo ya configurado, PLAY RECAP debe mostrar 'changed=0' para este rol.

- name: Instalar paquetes base del lab (idempotente en las 4 versiones de RHEL)
  ansible.builtin.package:
    name: "{{ lab_common_packages }}"
    state: present

# /etc/localtime es un enlace a ../usr/share/zoneinfo/<Zona> en RHEL 7/8/9/10.
# Se lee con 'stat' (módulo de solo lectura) y no con 'timedatectl show', que
# no existe en el systemd 219 de RHEL 7. Además 'stat' SÍ se ejecuta en --check,
# mientras que command/shell se omiten en simulación (y ocultan fallos).
- name: Leer huso horario actual (enlace simbólico /etc/localtime)
  ansible.builtin.stat:
    path: /etc/localtime
  register: lab_localtime

- name: "Fijar huso horario del lab ({{ lab_timezone }})"
  ansible.builtin.command: "timedatectl set-timezone {{ lab_timezone }}"
  when: not (lab_localtime.stat.lnk_target | default('')).endswith('zoneinfo/' ~ lab_timezone)

- name: Desplegar marcador de gestión por Ansible (NO toca /etc/issue, que gestiona la Etapa 5)
  ansible.builtin.template:
    src: ansible-lab-managed.j2
    dest: /etc/ansible-lab-managed.txt
    owner: root
    group: root
    mode: "0644"
  notify: registrar cambio de configuracion gestionada por ansible

- name: Confirmar que el secreto de Ansible Vault se ha descifrado (solo demo, nunca se imprime el valor)
  ansible.builtin.debug:
    msg: "Vault OK: lab_demo_api_token cargado ({{ lab_demo_api_token | length }} caracteres)"
  when: lab_demo_api_token is defined
